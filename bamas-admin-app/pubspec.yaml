name: bamas_admin
description: "Bamas Admin app - receive order notifications, accept/reject/complete orders, toggle menu availability."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Talks to the FastAPI backend (bamas-admin-backend) ---
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # --- Menu editor: pick a photo from the gallery to upload ---
  image_picker: ^1.1.2

  # --- Push notifications (subscribes to the SAME FCM topic the existing
  # Cloud Function already publishes new-order pushes to; see
  # bamas/functions/index.js and docs/ARCHITECTURE.md) ---
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
