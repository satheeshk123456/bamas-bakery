org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround: the Kotlin compiler's incremental/relocatable build cache
# crashes ("this and base files have different roots") when the project
# (F:\...) and the Pub/Gradle caches (C:\Users\...) are on different
# Windows drive letters. Disabling incremental Kotlin compilation avoids it.
kotlin.incremental=false
